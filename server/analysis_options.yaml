# Pure Dart: no Flutter lints to include. Same strictness as the app.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: warning

linter:
  rules:
    - curly_braces_in_flow_control_structures
    - prefer_final_locals
    - avoid_print
    - unawaited_futures

formatter:
  page_width: 110
