include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - linux/**
    - server/**   # its own package, checked by online.yml

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks

formatter:
  page_width: 110
