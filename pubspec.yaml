name: duel
description: >-
  Card games, head to head: play against another player online or against
  a bot.
publish_to: none
version: 0.5.1+8

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Your profile, wallet, stats and settings, saved on the phone (Swift
  # Package on iOS: no Podfile).
  shared_preferences: ^2.5.5

  # The game rules and bots (pure Dart, shared with the online referee).
  duel_engine:
    path: packages/duel_engine
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Fredoka (OFL, assets/fonts/OFL.txt), static weights cut from the
    # variable font with fontTools.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
