name: Online
# The online side: the referee (server/) on Cloud Run and the Firestore
# security rules (firebase/). Checked on every push that touches them;
# deployed from main once the Google Cloud secrets exist (docs/ONLINE.md,
# "Your steps"). Without them the deploy jobs just say so.
on:
  push:
    paths: ['server/**', 'packages/duel_engine/**', 'firebase/**', '.github/workflows/online.yml']
  workflow_dispatch:
concurrency:
  group: online-${{ github.ref }}
  cancel-in-progress: false
env:
  REGION: us-east4   # same place as the Firestore database
  SERVICE: duel-referee

jobs:
  # dart analyze + the referee's tests, including a real Firestore (the
  # emulator) with the security rules loaded.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: actions/setup-java@v4   # the Firestore emulator runs on Java
        with: { distribution: temurin, java-version: '21' }
      - run: dart pub get
        working-directory: server
      - run: dart analyze --fatal-infos
        working-directory: server
      - run: dart format --output=none --set-exit-if-changed lib bin test
        working-directory: server
      - name: Tests on the Firestore emulator
        working-directory: firebase
        run: npx -y firebase-tools@14 emulators:exec --only firestore --project demo-duel "cd ../server && dart test"
      - name: The image builds
        run: docker build -f server/Dockerfile -t referee .

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        id: secrets
        env:
          KEY: ${{ secrets.GCP_DEPLOY_KEY }}
          PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PROJECT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No GCP_DEPLOY_KEY secret / FIREBASE_PROJECT variable yet: not deploying (docs/ONLINE.md, Your steps)."
          fi
      - if: steps.secrets.outputs.ok
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_KEY }}
      - if: steps.secrets.outputs.ok
        uses: google-github-actions/setup-gcloud@v2
      # Straight to the Rules API (firebase deploy wants more rights than
      # publishing rules needs). The live database has no custom indexes.
      - name: Security rules
        if: steps.secrets.outputs.ok
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          TOKEN=$(gcloud auth print-access-token)
          API="https://firebaserules.googleapis.com/v1/projects/$PROJECT"
          BODY=$(python3 -c 'import json;print(json.dumps({"source":{"files":[{"name":"firestore.rules","content":open("firebase/firestore.rules").read()}]}}))')
          RULESET=$(curl -fsS -X POST "$API/rulesets" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$BODY" | python3 -c 'import sys,json;print(json.load(sys.stdin)["name"])')
          RELEASE="projects/$PROJECT/releases/cloud.firestore"
          REL=$(python3 -c "import json;print(json.dumps({'release':{'name':'$RELEASE','rulesetName':'$RULESET'}}))")
          curl -fsS -X PATCH "https://firebaserules.googleapis.com/v1/$RELEASE" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$REL" > /dev/null ||
            curl -fsS -X POST "$API/releases" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "{\"name\":\"$RELEASE\",\"rulesetName\":\"$RULESET\"}" > /dev/null
          echo "Rules live: $RULESET" >> "$GITHUB_STEP_SUMMARY"
      # Firestore deletes documents once their expireAt has passed (games a
      # day after the last move, parties after 30 days; see the referee).
      - name: Auto-delete old games and parties
        if: steps.secrets.outputs.ok
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          for group in matches secrets hands parties codes; do
            gcloud firestore fields ttls update expireAt --collection-group="$group" \
              --enable-ttl --async --quiet --project "$PROJECT" ||
              echo "::warning::Couldn't turn on auto-delete for $group"
          done
      - name: Referee to Cloud Run
        if: steps.secrets.outputs.ok
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/duel/referee:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          # Anyone may call it (the app signs in with Firebase; the referee
          # checks every token). Scales to zero when nobody plays.
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --allow-unauthenticated \
            --service-account "duel-referee@$PROJECT.iam.gserviceaccount.com" \
            --set-env-vars "FIREBASE_PROJECT=$PROJECT" \
            --cpu 1 --memory 512Mi --concurrency 80 --min-instances 0 --max-instances 4 --quiet
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/health" > /dev/null
          echo "Referee live at $URL (FirebaseConfig.referee)" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        id: referee
      - name: Live check (two test players play a game)
        if: steps.secrets.outputs.ok
        env:
          KEY: ${{ vars.FIREBASE_WEB_KEY || 'AIzaSyAhfArKUtca12ULpDxe0t9P0m12Yj87lQ0' }}
        run: python3 tool/online/smoke.py "${{ steps.referee.outputs.url }}" "${{ vars.FIREBASE_PROJECT }}" "$KEY"
      - name: Diagnose (on failure)
        if: failure() && steps.secrets.outputs.ok
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          echo "--- databases"; gcloud firestore databases list --project "$PROJECT" --format 'table(name,locationId,type,databaseEdition)' || true
          echo "--- referee log"; gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE" \
            --project "$PROJECT" --freshness 30m --limit 30 --format 'value(textPayload)' || true
