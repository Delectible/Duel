name: Build
# Only main builds on push: work in progress lives on other branches and is
# pushed to main in one go when Luca says so (one build per batch). Any
# branch can still be built by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'fastlane/**', 'server/**', 'firebase/**', 'tool/online/**', '.github/workflows/play-listing.yml', '.github/workflows/online.yml', '.github/workflows/android-smoke.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iPhone app
        type: boolean
        default: true
      testflight:
        description: Also upload the iPhone build to TestFlight (main always does)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  ORG: com.dingo          # app id com.dingo.duel (as registered on Google Play)
  APP: duel

jobs:
  # flutter analyze + flutter test. A build is only published when these pass.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # flutter create re-resolves packages (upgrading them): put the
      # committed pubspec.lock back so builds use exactly what we tested.
      - run: |
          flutter create --org $ORG --project-name $APP --platforms android .
          git checkout -- pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Unpack the private upload key (repo secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "DUEL_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with the public test key."
          fi
      # versionCode = run number, so every build is newer than the last (Play
      # refuses to take the same versionCode twice).
      - name: Build the APK (sideloading) and app bundle (Play Store)
        env:
          DUEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Duel-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Duel-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/ }

  # Mac build minutes are free on public repos but cost 10x on private ones,
  # so on a private repo the iPhone build only runs when asked for: put [ios]
  # in the commit message, or start the workflow by hand.
  ios:
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || (github.event_name == 'push' && (!github.event.repository.private || contains(github.event.head_commit.message, '[ios]')))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Fill in the Xcode project
        run: |
          flutter create --org $ORG --project-name $APP --platforms ios .
          git checkout -- pubspec.lock
          flutter pub get --enforce-lockfile
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' ios/Runner.xcodeproj/project.pbxproj
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Package an unsigned .ipa (signed on your computer when sideloading)
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          # Ad-hoc sign every framework and the app: Sideloadly re-signs
          # with your Apple ID, and its signer fails on a binary that has
          # never been signed ("macho sign/edit failed (-18)"); it only has to
          # replace an existing signature.
          xattr -cr dist/Payload/Runner.app
          for f in dist/Payload/Runner.app/Frameworks/*.framework dist/Payload/Runner.app/Frameworks/*.dylib; do
            if [ -e "$f" ]; then codesign --force --sign - --timestamp=none "$f"; fi
          done
          codesign --force --sign - --timestamp=none dist/Payload/Runner.app
          codesign --verify --deep --strict dist/Payload/Runner.app && echo "ad-hoc signed"
          cd dist && zip -qry Duel-${{ github.run_number }}.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/ }
      # TestFlight (main only), as Darkroom does it. Needs the repo secrets
      # APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY (the .p8 file's
      # text; an App Store Connect API key with the Admin role, so Xcode can
      # make the signing certificate and profile itself) and APPLE_TEAM_ID,
      # plus the app made in App Store Connect with bundle id com.dingo.duel.
      # Without them the job just says so. The archive is unsigned
      # (automatic signing at archive time wants a registered iPhone); the
      # export signs it for the App Store with Apple's cloud-managed
      # distribution certificate. CFBundleVersion = run number.
      - name: Look for the App Store Connect key
        id: asc
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.testflight)
        env:
          KEY: ${{ secrets.APPSTORE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$TEAM" ]; then
            mkdir -p "$RUNNER_TEMP/asc"
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No App Store Connect key secrets: not uploading to TestFlight."
          fi
      - name: Sign and upload to TestFlight
        if: steps.asc.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="$TEAM" archive | tail -n 40
          test -d "$RUNNER_TEMP/Runner.xcarchive"
          # Firebase's prebuilt frameworks (grpc, absl, Firestore…) come
          # signed by Google, and the export keeps that signature, which the
          # App Store rejects ("Invalid Signature", 90035). Strip them so the
          # export signs them for us like every other framework.
          # They also come without crash-symbol files (dSYMs): make one from
          # each binary so the export can upload symbols for every framework
          # (Google strips the debug info, so they hold little more than the
          # binary's UUID, but that's what App Store Connect checks).
          for f in "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/Frameworks/"*.framework; do
            name=$(basename "$f" .framework)
            dsym="$RUNNER_TEMP/Runner.xcarchive/dSYMs/$name.framework.dSYM"
            if [ ! -d "$dsym" ]; then
              xcrun dsymutil "$f/$name" -o "$dsym" 2>&1 | grep -v "no debug symbols" || true
            fi
            codesign --remove-signature "$f" 2>/dev/null || true
            rm -rf "$f/_CodeSignature"
          done
          ls "$RUNNER_TEMP/Runner.xcarchive/dSYMs"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
      - name: Forget the key
        if: always() && steps.asc.outputs.ok == 'true'
        run: rm -rf "$RUNNER_TEMP/asc"

  # Opens the release APK on an Android emulator and fails unless the app
  # draws its first frame (the "Duel: first frame" log line) and is still
  # running. Nothing goes to Releases or Play without it: tests can't catch
  # a native plugin that breaks only in a release build.
  launch:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android, path: dist }
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r dist/Duel-${{ github.run_number }}.apk
            adb logcat -c
            adb shell am start -W -n com.dingo.duel/.MainActivity || true
            sleep 40
            adb exec-out screencap -p > launch.png
            adb logcat -d > logcat.txt
            grep -E "Duel:|E flutter|FATAL|AndroidRuntime" logcat.txt | tail -60 || true
            grep -q "Duel: first frame" logcat.txt || { echo "::error::The app never drew its first frame (stuck on the splash?)"; exit 1; }
            adb shell pidof com.dingo.duel > /dev/null || { echo "::error::The app is no longer running"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: launch, path: "launch.png\nlogcat.txt" }

  release:
    needs: [check, android, ios, launch]
    if: always() && needs.check.result == 'success' && needs.android.result == 'success' && needs.launch.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: rm -f dist/launch.png dist/logcat.txt   # the launch check's, not for release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Duel build ${{ github.run_number }} (${{ github.ref_name }})
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          prerelease: ${{ github.ref_name != 'main' }}
          target_commitish: ${{ github.sha }}
          files: dist/*

  # Google Play internal testing. Needs the repo secret PLAY_SERVICE_ACCOUNT_JSON
  # (a service account invited in Play Console > Users and permissions);
  # without it the job just says so. Only builds from main go to Play.
  # Play only accepts API uploads once the first .aab was uploaded by hand.
  # The store listing itself is published by play-listing.yml.
  play:
    needs: [check, android, launch]
    if: github.ref == 'refs/heads/main' && needs.check.result == 'success' && needs.android.result == 'success' && needs.launch.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Look for the Play service account
        id: sa
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret: not uploading to Google Play."; fi
      - uses: actions/download-artifact@v4
        if: steps.sa.outputs.ok == 'true'
        with: { name: android, path: dist }
      - uses: actions/checkout@v4
        if: steps.sa.outputs.ok == 'true'
        with: { path: src }
      # "What's new" = version + AppInfo.latest (this build's change).
      - name: Release notes
        if: steps.sa.outputs.ok == 'true'
        run: |
          mkdir whatsnew
          python3 -I src/tool/play/whats_new.py > whatsnew/whatsnew-en-AU
          cat whatsnew/whatsnew-en-AU
      - uses: r0adkll/upload-google-play@v1
        if: steps.sa.outputs.ok == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dingo.duel
          releaseFiles: dist/Duel-${{ github.run_number }}.aab
          tracks: internal
          # 'completed' rolls out to testers straight away. While the app is
          # still a draft in the Play Console, Play only takes 'draft':
          # set the repo variable PLAY_RELEASE_STATUS=draft until then.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew
