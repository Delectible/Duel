name: Promote to closed testing
# Also sends the same build to TestFlight's external testers ("Friends")
# and submits it for Apple's beta review (tool/testflight/external.py).
# The slow path: sends a build that's already on internal testing to the
# closed testing track ("alpha" in the Play API), with its release notes.
# Every push to main still goes straight to internal testing (build-apk.yml),
# so the owner keeps getting every build; testers on the closed track only
# get the builds promoted here. Play reviews each closed release.
#
# Run it from the Actions tab: "Promote to closed testing" > Run workflow.
# Leave the build number empty for the newest internal build.
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build number to promote (empty = newest on internal testing / TestFlight)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: play-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Look for the Play service account
        run: |
          if [ -z "$SA" ]; then echo "::error::No PLAY_SERVICE_ACCOUNT_JSON secret."; exit 1; fi
      - run: sudo gem install fastlane --no-document --quiet
      - name: Promote internal -> closed testing
        env:
          BUILD: ${{ inputs.build }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/play.json"
          extra=()
          if [ -n "$BUILD" ]; then extra+=("version_code:$BUILD"); fi
          fastlane run supply \
            package_name:com.dingo.duel \
            json_key:"$RUNNER_TEMP/play.json" \
            track:internal \
            track_promote_to:alpha \
            release_status:completed \
            deactivate_on_promote:false \
            skip_upload_apk:true \
            skip_upload_aab:true \
            skip_upload_metadata:true \
            skip_upload_changelogs:true \
            skip_upload_images:true \
            skip_upload_screenshots:true \
            "${extra[@]}"

  testflight:
    runs-on: ubuntu-latest
    env:
      APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Look for the App Store Connect key
        run: |
          if [ -z "$APPSTORE_KEY" ] || [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_ISSUER_ID" ]; then
            echo "::error::No App Store Connect key secrets."; exit 1
          fi
      - run: pip install --quiet pyjwt cryptography requests
      - name: TestFlight -> external testers (Friends) + beta review
        env:
          BUILD: ${{ inputs.build }}
        run: python3 tool/testflight/external.py "$BUILD"
